name: Hourly IMGW Data Update

on:
  schedule:
    - cron: '*/15 * * * *'  
  workflow_dispatch:     # Pozwala uruchomić skrypt ręcznie jednym kliknięciem

concurrency:
  group: imgw-data-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Sprawdzenie kodu repozytorium
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja wymaganych bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Uruchomienie skryptu bazy danych IMGW
      run: python imgw_data.py

    - name: Automatyczny zapis bazy do repozytorium
      run: |
        git config --global user.name "IMGW Data Bot"
        git config --global user.email "actions@github.com"
        git config --global pull.rebase true

        date_str=$(python -c 'from datetime import datetime; import zoneinfo; print(datetime.now(zoneinfo.ZoneInfo("Europe/Warsaw")).strftime("%Y-%m-%d"))')
        dated_file="imgw_data/${date_str}.geojson"

        if [ -f "imgw_data.geojson" ] && [ -f "imgw_data/dates.json" ] && [ -f "$dated_file" ]; then
          git add imgw_data.geojson imgw_data/dates.json "$dated_file"
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja bazy godzinowej IMGW: $(date +'%Y-%m-%d %H:%M')"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase z origin/main nie powiódł się. Prawdopodobnie jest konflikt między równoległymi uruchomieniami workflow."
              exit 1
            fi
            git push origin HEAD:main
          else
            echo "Brak nowych danych do zapisania."
          fi
        else
          echo "Błąd: oczekiwane pliki nie powstały podczas działania skryptu Pythona."
          echo "Sprawdź, czy wygenerowano: imgw_data.geojson, imgw_data/dates.json, $dated_file"
          exit 1
        fi